[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuktech-charger-ha-integration"
version = "1.1.0"
description = "Home Assistant integration for CUKTECH 10 GaN Charger Ultra"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "bleak>=0.21",
    "bleak-retry-connector>=3.4",
    "cryptography>=41",
    "voluptuous>=0.13",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.cuktech_charger" = ["*.json", "translations/*.json", "brand/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
